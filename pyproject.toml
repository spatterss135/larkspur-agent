[project]
name = "larkspur-agent"
version = "0.1.0"
description = "An email inquiry agent for a fictional event venue that earns autonomy one action at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
