# Normal cases: routine inquiries a venue gets every week. Each has one clear right answer.
# Fixed "today" is Monday 2026-03-02 unless a case says otherwise.

- id: faq-parking
  why: Basic docs question; answer comes from one doc
  bucket: normal
  slices: [docs]
  today: 2026-03-02
  email: {from: priya.shah@example.com, subject: "Parking", body: "Hi there, is there parking at the venue for our guests? We're expecting around 150 people."}
  expected:
    outcome: must_handle
    must_call: [{tool: search_venue_docs, if_missed: cautious}]
    must_not_call: [place_hold, book_tour]
    docs_any_of: [parking-transport]

- id: faq-outside-alcohol
  why: Policy question with a clear "no"; must not soften it into a maybe
  bucket: normal
  split: holdout   # chosen by random.Random(2026).sample; not inspected during phase 7
  slices: [docs, policy]
  today: 2026-03-02
  email: {from: marcus.bell@example.com, subject: "Bringing our own wine", body: "My uncle makes wine and wanted to gift a few cases for the wedding. Can we bring our own wine to serve?"}
  expected:
    outcome: must_handle
    must_call: [{tool: search_venue_docs, if_missed: cautious}]
    docs_any_of: [catering-bar]
    reply:
      must_not_claim: [outside wine is allowed, a corkage fee applies]

- id: faq-outside-caterer
  why: Exclusive catering; the only exceptions are a licensed bakery and cultural or religious meals arranged with a coordinator, and a taco truck is neither
