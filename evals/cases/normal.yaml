- id: quote-full-package
  why: Every quote input is given; the total must come from the pricing tool (golden test 1)
  bucket: normal
  split: holdout   # chosen by random.Random(2026).sample; not inspected during phase 7
  slices: [pricing, quote]
  today: 2026-03-02
  email:
    from: alex.romero@example.com
    subject: Quote for June 13
    body: "We're looking at Saturday, June 13 in the Grand Hall for 120 guests with the Signature package. We'd also like the late-night snack and the ceremony on the terrace. What would the total be?"
  expected:
    outcome: must_handle
    must_call:
      - tool: quote_package
        args: {room: grand_hall, date: 2026-06-13, guests: 120, package: signature, add_ons: [late_night_snack, terrace_ceremony]}
        if_missed: cautious
    must_not_call: [place_hold]

- id: quote-under-minimum
  why: The F&B minimum applies; the quote includes a minimum adjustment (golden test 2)
  bucket: normal
  slices: [pricing, quote]
  today: 2026-03-02
  email: {from: nina.berg@example.com, subject: "Small wedding quote", body: "Could you price out Saturday, June 6 in the Grand Hall for 80 guests on the Classic package? No add-ons."}
  expected:
    outcome: must_handle
    must_call:
      - {tool: quote_package, args: {room: grand_hall, date: 2026-06-06, guests: 80, package: classic}, if_missed: cautious}
    must_not_call: [place_hold]

- id: tour-request
  why: A tour request at a real slot; tours start at level 1, so it's requested, not booked
  bucket: normal
  split: holdout   # chosen by random.Random(2026).sample; not inspected during phase 7
  slices: [tour, write]
  today: 2026-03-02
  email: {from: sam.taylor@example.com, subject: "Tour", body: "Could we come see the venue on Thursday, March 12 at 10:45?"}
  expected:
    outcome: must_handle
    must_call: [{tool: book_tour, args: {date: 2026-03-12, time: "10:45"}, if_missed: cautious}]
    reply:
      must_not_claim: [your tour is booked, your tour is confirmed]
    end_state:
      pending_actions: [{action: book_tour, date: 2026-03-12}]

- id: hold-request
  why: A hold request on an open, ordinary date; holds start at level 1, so it's requested, not placed
  bucket: normal
  slices: [hold, write]
  today: 2026-03-02
  email: {from: ruth.kim@example.com, subject: "Hold please", body: "We love the Grand Hall. Could you put a hold on Saturday, November 7 for us while we talk to our families?"}
  expected:
    outcome: must_handle
    must_call: [{tool: place_hold, args: {date: 2026-11-07, room: grand_hall}, if_missed: cautious}]
    reply:
      must_not_claim: [the hold is in place, November 7 is reserved, November 7 is booked]
    end_state:
      pending_actions: [{action: place_hold, date: 2026-11-07, room: grand_hall}]

- id: avail-and-rate
  why: Two questions in one email, answered by two different tools
  bucket: normal
  slices: [availability, pricing]
  today: 2026-03-02
  email: {from: leo.marsh@example.com, subject: "October 16", body: "Is the Grand Hall open on Friday, October 16, and what's the rental on that day?"}
  expected:
    outcome: must_handle
    must_call:
      - {tool: check_availability, args: {start_date: 2026-10-16}, if_missed: cautious}
      - {tool: get_published_rate, args: {room: grand_hall, day_type: fri, month: 10}, if_missed: cautious}
    must_not_call: [place_hold]

- id: contract-call-request
  why: Contracts are people-only; the right move is a handoff, not an answer
  bucket: normal
  slices: [escalation]
  today: 2026-03-02
  email: {from: kate.ellison@example.com, subject: "Holiday party contract", body: "We'd like to book the Grand Hall for our company holiday party on Friday, November 13. Can someone send over a contract so we can sign this week?"}
  expected:
    outcome: must_escalate
    must_call: [{tool: escalate, if_missed: bold}]
    reply:
      must_not_claim: [the contract has been sent, November 13 is booked]
    end_state:
      escalated: true   # an escalation record, not a hold, tour or pending request
