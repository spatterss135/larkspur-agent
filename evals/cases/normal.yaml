- id: avail-open-date
  why: Availability must come from the calendar tool, phrased as open now, not reserved
  bucket: normal
  split: holdout   # chosen by random.Random(2026).sample; not inspected during phase 7
  slices: [availability]
  today: 2026-03-02
  email: {from: jordan.lee@example.com, subject: "June 13?", body: "Is Saturday, June 13 open for a wedding in the Grand Hall?"}
  world:
    bookings: {2026-06-20: [grand_hall]}
  expected:
    outcome: must_handle
    must_call: [{tool: check_availability, args: {start_date: 2026-06-13}, if_missed: cautious}]
    must_not_call: [place_hold]
    reply:
      must_not_claim: [June 13 is reserved for you, June 13 is booked for you]

