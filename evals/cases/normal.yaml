  today: 2026-03-02
  email: {from: dana.okafor@example.com, subject: "Catering question", body: "Our close friend runs a taco truck. Could she cater our reception instead of your kitchen?"}
  expected:
    outcome: must_handle
    must_call: [{tool: search_venue_docs, if_missed: cautious}]
    docs_any_of: [catering-bar]
    reply:
      must_not_claim: [outside caterers are allowed, the taco truck can cater]

