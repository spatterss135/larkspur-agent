      must_not_claim: [confetti is allowed]

- id: answer-plus-changed-room
  why: The customer answers the agent's question and changes a detail in the same line. The quote uses 90 guests and the Garden Terrace (in season in June, seats 120), not the Grand Hall from the first message
  bucket: messy
  split: holdout   # chosen by random.Random(2026).sample; not inspected during phase 7
  slices: [quote, thread, noise]
  today: 2026-03-03
  email: {from: mina.sato@example.com, subject: "Re: Saturday June 6", body: "90 people, and actually make it the Terrace instead"}
  thread:
    - {role: customer, body: "What would Saturday, June 6 in the Grand Hall cost on the Classic package?"}
    - {role: agent, body: "Happy to price that out! About how many guests are you expecting?"}
  expected:
    outcome: must_handle
    must_call:
      - {tool: quote_package, args: {room: garden_terrace, date: 2026-06-06, guests: 90, package: classic}, if_missed: cautious}
    must_not_call: [place_hold]
    reply:
      must_not_ask: [guest_count, event_date, package]
      must_mention: [the quote is for the Garden Terrace]
